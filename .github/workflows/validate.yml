name: Validate HREnter
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_USER: ci
      DB_NAME: hrenter_ci
      DB_SSL_MODE: disabled
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
